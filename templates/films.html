<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <title>Список фільмів</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
                background-color: #2a2a2a;
            }

            h1 {
                text-align: center;
                color: white;
            }

            table {
                width: 50%;
                margin: 0 auto;
                border-collapse: collapse;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                color: white;
                background-color: #3c3c3c;
                border-color: white;
            }

            th, td {
                padding: 12px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }

            th {
                background-color: #7016ff;
                color: white;
            }

            th a {
                color: white;
                text-decoration: none;
            }

            th a:hover {
                color: #cacaca;
            }

            tr:hover {
                background-color: #454545;
            }
        </style>
    </head>
    <body>
        <h1>Список фільмів</h1>
        <table>
            <tr>
                <th><a href="/?sort=id">ID</a></th>
                <th><a href="/?sort=name">Назва</a></th>
                <th><a href="/?sort=price">Ціна квитка</a></th>
            </tr>
            {% for film in films %}
                <tr>
                    <td>{{ film.id }}</td>
                    <td>{{ film.name }}</td>
                    <td>{{ film.price }} грн</td>
                </tr>
            {% endfor %}
        </table>
    </body>
</html>
